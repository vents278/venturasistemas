<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tarefas — ERP</title>
  <link rel="stylesheet" href="css/base.css" />
  <style>
    .board { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .col { border:1px solid #e2e8f0; padding:8px; min-height:200px; }
    .card { border:1px solid #cbd5e1; padding:8px; margin:8px 0; font-size:.85rem; }
    .bar { display:flex; gap:8px; margin:12px 0; }
  </style>
</head>
<body>
  <aside id="sidebar"></aside>
  <main>
    <header id="topbar"><h1>Tarefas (manual)</h1><a href="index.html">← Início</a> | <a href="pendencias.html">Pendências</a></header>
    <div class="bar">
      <input id="titulo" placeholder="nova tarefa..." />
      <button onclick="criar()">+ Criar</button>
      <button onclick="carregar()">Atualizar</button>
    </div>
    <div class="board">
      <div class="col" id="c_A_FAZER" ondragover="event.preventDefault()" ondrop="soltar(event,'A_FAZER')"><h3>A Fazer (<span id="n_A_FAZER">0</span>)</h3></div>
      <div class="col" id="c_EM_ANDAMENTO" ondragover="event.preventDefault()" ondrop="soltar(event,'EM_ANDAMENTO')"><h3>Em Andamento (<span id="n_EM_ANDAMENTO">0</span>)</h3></div>
      <div class="col" id="c_AGUARDANDO" ondragover="event.preventDefault()" ondrop="soltar(event,'AGUARDANDO')"><h3>Aguardando (<span id="n_AGUARDANDO">0</span>)</h3></div>
      <div class="col" id="c_CONCLUIDO" ondragover="event.preventDefault()" ondrop="soltar(event,'CONCLUIDO')"><h3>Concluído (<span id="n_CONCLUIDO">0</span>)</h3></div>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const COLS = ["A_FAZER", "EM_ANDAMENTO", "AGUARDANDO", "CONCLUIDO"];
    async function api(path, opts = {}) {
      const h = { "Content-Type": "application/json", ...(opts.headers || {}) };
      const t = sessionStorage.getItem("erp_token");
      if (t) h.Authorization = "Bearer " + t;
      const r = await fetch(API_BASE + path, { ...opts, headers: h });
      if (r.status === 401) { location.href = "login.html"; throw new Error("Não autenticado"); }
      if (!r.ok) throw new Error(await r.text());
      return r.status === 204 ? null : r.json();
    }
    const NOME = { A_FAZER: "A Fazer", EM_ANDAMENTO: "Em Andamento", AGUARDANDO: "Aguardando", CONCLUIDO: "Concluído" };
    async function carregar() {
      const d = await api("/tarefas");
      COLS.forEach((c) => {
        document.getElementById("c_" + c).innerHTML = `<h3>${NOME[c]} (<span id="n_${c}">0</span>)</h3>`;
      });
      d.forEach((t) => {
        const el = document.createElement("div"); el.className = "card";
        el.draggable = true; el.ondragstart = (e) => e.dataTransfer.setData("text/plain", t.id);
        el.innerHTML = `<strong>${t.titulo}</strong> <small>[${t.prioridade}]</small><br/>` +
          COLS.map((c) => c !== t.status ? `<button onclick="mover('${t.id}','${c}')">${c}</button>` : "").join(" ");
        document.getElementById("c_" + t.status).appendChild(el);
        document.getElementById("n_" + t.status).textContent = +document.getElementById("n_" + t.status).textContent + 1;
      });
    }
    async function soltar(e, status) {
      e.preventDefault();
      await mover(e.dataTransfer.getData("text/plain"), status);
    }
    async function criar() {
      if (!titulo.value.trim()) return;
      await api("/tarefas", { method: "POST", body: JSON.stringify({ titulo: titulo.value }) });
      titulo.value = ""; carregar();
    }
    async function mover(id, status) { await api("/tarefas/" + id, { method: "PATCH", body: JSON.stringify({ status }) }); carregar(); }
    carregar();
  </script>
</body>
</html>
