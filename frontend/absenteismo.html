<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Absenteísmo — ERP</title>
  <link rel="stylesheet" href="css/base.css" />
  <style>
    table { width:100%; border-collapse:collapse; } th,td { border-bottom:1px solid #e2e8f0; padding:8px; font-size:.85rem; text-align:left; }
    .bar { display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
    #ind { font-weight:bold; margin:8px 0; }
  </style>
</head>
<body>
  <aside id="sidebar"></aside>
  <main>
    <header id="topbar"><h1>Absenteísmo</h1><a href="index.html">← Início</a></header>
    <div class="bar">
      <input id="de" type="date" /> <input id="ate" type="date" />
      <input id="setor" placeholder="setor (opcional)" />
      <button onclick="carregar()">Filtrar</button>
    </div>
    <div id="ind"></div>
    <table><thead><tr><th>Data</th><th>Funcionário</th><th>Tipo</th><th>Período</th></tr></thead><tbody id="tb"></tbody></table>
  </main>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function api(path, opts = {}) {
      const h = { "Content-Type": "application/json", ...(opts.headers || {}) };
      const t = sessionStorage.getItem("erp_token");
      if (t) h.Authorization = "Bearer " + t;
      const r = await fetch(API_BASE + path, { ...opts, headers: h });
      if (r.status === 401) { location.href = "login.html"; throw new Error("Não autenticado"); }
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }
    async function carregar() {
      const p = new URLSearchParams();
      if (de.value) p.set("de", de.value); if (ate.value) p.set("ate", ate.value); if (setor.value) p.set("setor", setor.value);
      const [lista, ind] = await Promise.all([api("/absenteismo?" + p), api("/absenteismo/indicadores?" + p)]);
      tb.innerHTML = lista.map((x) => `<tr><td>${x.data}</td><td>${(x.funcionarios || {}).nome || x.funcionario_id}</td>
        <td>${(x.tipos_ausencia || {}).codigo || x.tipo_id}</td><td>${x.periodo}</td></tr>`).join("") || '<tr><td colspan="4">Sem registros</td></tr>';
      ind.textContent = `Dias perdidos: ${ind.dias_perdidos} | Taxa: ${ind.taxa_absenteismo}% (${ind.funcionarios_ativos} ativos × ${ind.dias_uteis} dias úteis)`;
    }
    carregar();
  </script>
</body>
</html>
