<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assistente — ERP</title>
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <aside id="sidebar"></aside>
  <main>
    <header id="topbar"><h1>Assistente (local, somente leitura)</h1><a href="index.html">← Início</a></header>
    <div style="display:flex;gap:8px;margin:12px 0">
      <input id="data" type="date" /><button onclick="resumo()">Resumo do dia</button>
    </div>
    <pre id="out"></pre>
    <div style="display:flex;gap:8px;margin:12px 0">
      <input id="q" placeholder="Ex: pendências abertas?" style="flex:1" /><button onclick="perguntar()">Perguntar</button>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function post(path, body) {
      const t = sessionStorage.getItem("erp_token");
      const r = await fetch(API_BASE + path, { method: "POST",
        headers: { "Content-Type": "application/json", ...(t ? { Authorization: "Bearer " + t } : {}) },
        body: JSON.stringify(body) });
      if (r.status === 401) { location.href = "login.html"; throw new Error("Não autenticado"); }
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }
    data.valueAsDate = new Date();
    async function resumo() { out.textContent = JSON.stringify(await post("/ai/resumo-dia", { data: data.value }), null, 2); }
    async function perguntar() { out.textContent = JSON.stringify(await post("/ai/perguntar", { pergunta: q.value }), null, 2); }
    resumo();
  </script>
</body>
</html>
