<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funcionários — ERP</title>
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <aside id="sidebar"></aside>
  <main>
    <header id="topbar"><h1>Funcionários</h1><a href="index.html">← Início</a></header>
    <div class="filters">
      <input id="q" placeholder="nome ou matrícula" oninput="debounceBusca()" />
      <select id="ativo" onchange="carregar()"><option value="">todos</option><option value="true">ativos</option><option value="false">inativos</option></select>
      <input id="setor" placeholder="setor" oninput="debounceBusca()" />
      <button onclick="carregar()">Filtrar</button>
      <button class="btn-primary" onclick="abrirModal()">+ Novo</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Matrícula</th><th>Nome</th><th>Cargo</th><th>Área</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </main>

  <div id="modal"><form id="form">
    <h2 id="mt">Novo funcionário</h2>
    <label class="full">Nome completo *<input id="f_nome" required /></label>
    <label>Cargo<input id="f_cargo" placeholder="ex.: Supervisor de Produção" /></label>
    <label>Área de atuação<input id="f_area" /></label>
    <label>Supervisor responsável<select id="f_sup"><option value="">selecione...</option></select></label>
    <label>Jornada padrão<select id="f_jornada"><option value="">selecione...</option></select></label>
    <label>Empresa<select id="f_emp"><option value="">selecione...</option></select></label>
    <label>Setor<input id="f_setor" /></label>
    <label>Matrícula<input id="f_matricula" placeholder="auto se vazio" /></label>
    <label>Admissão<input id="f_admissao" type="date" /></label>
    <label>Desligamento<input id="f_deslig" type="date" /></label>
    <label class="full">Observações<input id="f_obs" /></label>
    <label class="full" style="display:flex;flex-direction:row;gap:8px;align-items:center;font-weight:400">
      <input id="f_trein" type="checkbox" style="width:auto" />
      em treinamento (entra sozinho na grade como TREINAMENTO até ser ativado)
    </label>
    <button type="submit" class="full">Salvar</button>
    <button type="button" class="full" onclick="fecharModal()">Cancelar</button>
  </form></div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/funcionarios.js"></script>
</body>
</html>
