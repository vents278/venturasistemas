<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Selecionar empresa — ERP</title>
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <main class="loginwrap">
    <h1>Empresas</h1>
    <p class="sub">Qual empresa você vai gerir?</p>
    <div id="lista" class="grid" style="grid-template-columns:1fr"></div>
    <p id="err"></p>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      if (!sessionStorage.getItem("erp_token")) location.href = "login.html";
      try {
        const emps = await Auth.me().then(() => fetch(API_BASE + "/empresas", { headers: { Authorization: "Bearer " + sessionStorage.getItem("erp_token") } }).then((r) => r.json()));
        lista.innerHTML = emps.map((e) => `<a class="card" href="#" onclick="sel('${e.id}');return false"><b>${e.nome}</b>${e.cnpj || ""}</a>`).join("") || "Nenhuma empresa.";
      } catch (e) { err.textContent = e.message; }
    })();
    function sel(id) { sessionStorage.setItem("erp_empresa", id); location.href = "dashboard.html"; }
  </script>
</body>
</html>
