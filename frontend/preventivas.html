<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Programação de Preventivas — ERP</title>
  <link rel="stylesheet" href="css/base.css" />
  <style>
    #cards .card { padding: 12px 14px; }
    #cards .card span { display:block; color: var(--muted); font-size:.72rem; text-transform:uppercase; font-weight:700; }
    #cards .card b { font-size:1.5rem; }
    .st { padding:3px 10px; border-radius:999px; font-size:.72rem; font-weight:700; white-space:nowrap; }
    .st-PROGRAMADA { background:#e0e7ff; color:#3730a3; }
    .st-EM_ANDAMENTO { background:#dbeafe; color:#1e40af; }
    .st-AGUARDANDO_OS { background:#fef9c3; color:#854d0e; }
    .st-PARCIALMENTE_CONCLUIDA { background:#ffedd5; color:#9a3412; }
    .st-CONCLUIDA { background:#dcfce7; color:#166534; }
    .st-CANCELADA { background:#f1f5f9; color:#64748b; }
    .sit { padding:2px 9px; border-radius:999px; font-size:.7rem; font-weight:700; white-space:nowrap; }
    .sit-REGULARIZADO { background:#dcfce7; color:#166534; }
    .sit-OS_PENDENTE, .sit-AGUARDANDO_OS { background:#fef9c3; color:#854d0e; }
    .sit-PARCIALMENTE_REGULARIZADO { background:#ffedd5; color:#9a3412; }
    .sit-NAO_COMPARECEU { background:#fee2e2; color:#991b1b; }
    .sit-PROGRAMADO, .sit-NAO_PROGRAMADO { background:#e0e7ff; color:#3730a3; }
    table.mini { box-shadow:none; border:1px solid var(--line); }
    table.mini th, table.mini td { padding:5px 7px; font-size:.78rem; }
    #det { display:none; position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:110; overflow-y:auto; }
    .detpanel { background:var(--surface); max-width:1080px; margin:3vh auto; padding:18px; border-radius:var(--radius); }
    .detpanel h2 { margin:0 0 2px; }
    .dethead { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:10px; }
    .dethead .info { flex:1; min-width:220px; }
    .dethead .info small { color:var(--muted); }
    .sec { margin-top:14px; }
    .sec h3 { font-size:.95rem; margin:0 0 8px; }
    .oswrap { background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:8px; margin:6px 0; }
    .badge-pend { background:#fee2e2; color:#991b1b; padding:2px 8px; border-radius:999px; font-size:.7rem; font-weight:700; }
    .badge-ok { background:#dcfce7; color:#166534; padding:2px 8px; border-radius:999px; font-size:.7rem; font-weight:700; }
    .res { padding:5px 8px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
    .res:hover { background:#f8fafc; }
    .muted { color:var(--muted); font-size:.8rem; }
    .osline { display:grid; grid-template-columns: 90px 1fr 110px 70px auto auto; gap:6px; align-items:center; margin-bottom:5px; }
    @media (max-width:760px){ .osline { grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>
  <aside id="sidebar"></aside>
  <main>
    <header id="topbar"><h1>Programação de Preventivas</h1></header>

    <section id="cards" class="grid"></section>

    <div class="bar">
      <input id="de" type="date" title="de" />
      <input id="ate" type="date" title="até" />
      <input id="area" placeholder="área da planta..." />
      <select id="fstatus">
        <option value="">status: todos</option>
        <option value="PROGRAMADA">Programada</option>
        <option value="EM_ANDAMENTO">Em andamento</option>
        <option value="AGUARDANDO_OS">Aguardando OS</option>
        <option value="PARCIALMENTE_CONCLUIDA">Parcialmente concluída</option>
        <option value="CONCLUIDA">Concluída</option>
        <option value="CANCELADA">Cancelada</option>
      </select>
      <input id="funcionario" placeholder="funcionário (nome/matrícula)..." />
      <input id="cargo" placeholder="cargo..." />
      <input id="os_codigo" placeholder="nº da OS..." />
      <select id="situacao">
        <option value="">recebimento: todos</option>
        <option value="PENDENTE">Com OS pendente</option>
        <option value="REGULARIZADO">Regularizadas</option>
        <option value="SEM_OS">Sem OS lançada</option>
      </select>
      <button onclick="carregar()">Filtrar</button>
      <button class="btn-primary" onclick="abrirNova()">+ Nova preventiva</button>
      <span style="flex:1"></span>
      <select id="rel_tipo">
        <option value="preventivas-programacao">Relatório: programação</option>
        <option value="preventivas-execucao">Relatório: execução</option>
        <option value="preventivas-pendencias">Relatório: pendências</option>
      </select>
      <select id="rel_formato"><option value="xlsx">Excel</option><option value="pdf">PDF</option><option value="csv">CSV</option></select>
      <button onclick="baixarRelatorio()">Exportar</button>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr><th>Data</th><th>Área</th><th>Preventiva</th><th>Programados</th><th>Presentes</th><th>OS pendentes</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </main>

  <div id="modal"><form id="form">
    <h2 id="modalTitle">Nova preventiva</h2>
    <label>Data programada<input id="p_data" type="date" required /></label>
    <label>Área da planta<input id="p_area" required /></label>
    <label>Equipamento / setor<input id="p_equip" /></label>
    <label>Responsável<select id="p_resp"><option value="">-</option></select></label>
    <label>Início previsto<input id="p_ini" type="time" /></label>
    <label>Término previsto<input id="p_fim" type="time" /></label>
    <label class="full">Status
      <select id="p_status">
        <option value="AUTO">Automático (calculado pela programação/presença/OS)</option>
        <option value="PROGRAMADA">Programada</option>
        <option value="EM_ANDAMENTO">Em andamento</option>
        <option value="AGUARDANDO_OS">Aguardando OS</option>
        <option value="PARCIALMENTE_CONCLUIDA">Parcialmente concluída</option>
        <option value="CONCLUIDA">Concluída</option>
        <option value="CANCELADA">Cancelada</option>
      </select>
    </label>
    <label class="full">Descrição da manutenção<textarea id="p_desc" rows="2" required></textarea></label>
    <label class="full">Observações gerais<textarea id="p_obs" rows="2"></textarea></label>
    <div class="full" style="display:flex;gap:8px">
      <button type="submit" class="btn-primary">Salvar</button>
      <button type="button" onclick="fecharModal()">Fechar</button>
    </div>
  </form></div>

  <div id="det"><div class="detpanel" id="detBody"></div></div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/preventivas.js"></script>
</body>
</html>
