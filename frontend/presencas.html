<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Presença — ERP</title>
  <link rel="stylesheet" href="css/base.css" />
  <style>
    .gradewrap { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    table.grade { border-collapse: separate; border-spacing: 0; box-shadow: none; border-radius: 0; min-width: max-content; }
    table.grade th, table.grade td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 4px; font-size: .75rem; text-align: center; }
    table.grade thead th { position: sticky; top: 0; background: #f8fafc; z-index: 5; min-width: 64px; }
    table.grade thead th.wknd { background: #fef9c3; }
    table.grade td.sticky, table.grade th.sticky { position: sticky; left: 0; background: var(--surface); z-index: 6; text-align: left; min-width: 180px; max-width: 220px; }
    table.grade thead th.sticky { z-index: 7; }
    .cel { cursor: pointer; border-radius: 6px; padding: 5px 2px; min-height: 40px; font-weight: 700; }
    .cel small { display: block; font-weight: 400; color: var(--muted); }
    .cel.vazia { border: 1px dashed var(--line); color: var(--muted); font-weight: 400; }
    .PRESENTE { background: #dcfce7; color: #166534; } .DESLOCADO { background: #dbeafe; color: #1e40af; }
    .FALTA { background: #fee2e2; color: #991b1b; } .FOLGA { background: #f1f5f9; color: #64748b; }
    .FERIAS { background: #ccfbf1; color: #115e59; } .AFASTADO { background: #ffedd5; color: #9a3412; }
    .TREINAMENTO { background: #ede9fe; color: #5b21b6; }
    #modal .linhas input[type="number"] { width: 90px; }
    .lrow { display: flex; gap: 6px; margin-bottom: 6px; }
    .lrow select { flex: 1; }
  </style>
</head>
<body>
  <aside id="sidebar"></aside>
  <main>
    <header id="topbar"><h1>Grade de presença</h1></header>
    <div class="bar">
      <button onclick="mudarMes(-1)">◀</button>
      <input id="mes" type="month" />
      <button onclick="mudarMes(1)">▶</button>
      <input id="setor" placeholder="setor (opcional)" />
      <button onclick="carregar()">Carregar</button>
    </div>
    <div class="gradewrap"><table class="grade"><thead id="gh"></thead><tbody id="gb"></tbody></table></div>
  </main>
  <div id="modal"><form id="form" style="grid-template-columns:1fr">
    <h2 id="mt">Dia</h2>
    <label>Status
      <select id="f_status" class="full" style="width:100%"></select>
    </label>
    <label>Observações do dia
      <textarea id="f_obs" rows="2" style="width:100%"></textarea>
    </label>
    <div id="saldo"></div>
    <div>
      <strong>Apropriação do dia (ordens)</strong>
      <div id="linhas" class="linhas"></div>
      <button type="button" onclick="addLinha()">+ Ordem</button>
    </div>
    <button type="submit" class="btn-primary">Salvar dia</button>
    <button type="button" onclick="fecharModal()">Fechar</button>
  </form></div>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/presencas.js"></script>
</body>
</html>
